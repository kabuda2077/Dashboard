name: Check

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        # Version comes from the packageManager field in dashboard-src/package.json.
        uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard-src/package.json

      - name: Check build tooling and documentation
        shell: pwsh
        run: .\tools\check-maintenance.ps1

      - name: Run checks
        shell: pwsh
        run: .\tools\check.ps1 -Configuration Release

      # Use the already-built production UI with an isolated host/port/profile.
      # These checks need WebView2, but do not start a core or alter TUN/autostart.
      - name: Check retained desktop UI contract
        shell: pwsh
        run: dotnet test tests/Dashboard.Tests/Dashboard.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~CoreLayoutTests|FullyQualifiedName~CoreSetupLayoutTests" --logger "trx;LogFileName=core-layout.trx" --results-directory .tmp/reports/core-layout

      - name: Upload Core layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-layout
          path: |
            .tmp/reports/core-layout/
            .tmp/reports/core-chrome/
          if-no-files-found: warn
          retention-days: 7
